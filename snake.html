<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 20px;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 25px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-box .label {
            font-size: 0.85rem;
            color: #8892b0;
            margin-bottom: 3px;
        }

        .score-box .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00d2ff;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.15), 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            background: #0f3460;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
            transition: opacity 0.3s;
            z-index: 10;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .overlay p {
            color: #8892b0;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .overlay .final-score {
            color: #00d2ff;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: #fff;
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .controls-info {
            margin-top: 15px;
            color: #5a6a8a;
            font-size: 0.9rem;
        }

        .controls-info kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: inherit;
        }

        .difficulty-selector {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .diff-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #8892b0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        .diff-btn.active {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: #fff;
            border-color: transparent;
        }

        .diff-btn:hover:not(.active) {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .mobile-controls {
            display: none;
            margin-top: 20px;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
            justify-content: center;
        }

        .mobile-controls button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #00d2ff;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .mobile-controls button:active {
            background: rgba(0, 210, 255, 0.3);
        }

        .mobile-controls .up { grid-column: 2; grid-row: 1; }
        .mobile-controls .left { grid-column: 1; grid-row: 2; }
        .mobile-controls .right { grid-column: 3; grid-row: 2; }
        .mobile-controls .down { grid-column: 2; grid-row: 3; }

        @media (max-width: 500px) {
            .mobile-controls {
                display: grid;
            }

            h1 {
                font-size: 1.8rem;
            }

            canvas {
                max-width: 90vw;
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        
        <div class="score-board">
            <div class="score-box">
                <div class="label">得分</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="label">最高分</div>
                <div class="value" id="highScore">0</div>
            </div>
        </div>

        <div class="difficulty-selector">
            <button class="diff-btn active" data-speed="150">简单</button>
            <button class="diff-btn" data-speed="100">中等</button>
            <button class="diff-btn" data-speed="70">困难</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="overlay" id="startOverlay">
                <h2>🐍 贪吃蛇</h2>
                <p>使用方向键或 WASD 控制蛇的移动</p>
                <button class="btn" id="startBtn">开始游戏</button>
            </div>
            <div class="overlay hidden" id="gameOverOverlay">
                <h2>游戏结束</h2>
                <div class="final-score">得分: <span id="finalScore">0</span></div>
                <button class="btn" id="restartBtn">重新开始</button>
            </div>
            <div class="overlay hidden" id="pauseOverlay">
                <h2>已暂停</h2>
                <p>按空格键继续</p>
                <button class="btn" id="resumeBtn">继续游戏</button>
            </div>
        </div>

        <div class="mobile-controls">
            <button class="up" data-dir="up">▲</button>
            <button class="left" data-dir="left">◀</button>
            <button class="right" data-dir="right">▶</button>
            <button class="down" data-dir="down">▼</button>
        </div>

        <div class="controls-info">
            <kbd>↑↓←→</kbd> 或 <kbd>WASD</kbd> 控制 | <kbd>空格</kbd> 暂停
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏配置
        const GRID_SIZE = 20;
        const CELL_SIZE = canvas.width / GRID_SIZE;
        
        // 游戏状态
        let snake = [];
        let food = null;
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameLoop = null;
        let gameSpeed = 150;
        let isPaused = false;
        let isGameOver = false;
        let isGameStarted = false;
        
        // DOM 元素
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('finalScore');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        
        highScoreEl.textContent = highScore;

        // 初始化游戏
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            isGameOver = false;
            isPaused = false;
            scoreEl.textContent = score;
            spawnFood();
        }

        // 生成食物
        function spawnFood() {
            const emptyCells = [];
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    if (!snake.some(seg => seg.x === x && seg.y === y)) {
                        emptyCells.push({ x, y });
                    }
                }
            }
            if (emptyCells.length > 0) {
                food = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }
        }

        // 游戏主循环 - 更新逻辑
        function update() {
            if (isPaused || isGameOver) return;
            
            direction = { ...nextDirection };
            
            const head = { ...snake[0] };
            head.x += direction.x;
            head.y += direction.y;
            
            // 检查墙壁碰撞
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }
            
            // 检查自身碰撞
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver();
                return;
            }
            
            snake.unshift(head);
            
            // 检查是否吃到食物
            if (food && head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                spawnFood();
                // 每50分加速
                if (gameSpeed > 60 && score % 50 === 0) {
                    gameSpeed -= 5;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, gameSpeed);
                }
            } else {
                snake.pop();
            }
        }

        // 绘制游戏
        function draw() {
            // 背景
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 网格线
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
            
            // 绘制蛇
            snake.forEach((seg, i) => {
                const cx = seg.x * CELL_SIZE + CELL_SIZE / 2;
                const cy = seg.y * CELL_SIZE + CELL_SIZE / 2;
                
                const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, CELL_SIZE / 2);
                
                if (i === 0) {
                    // 蛇头
                    gradient.addColorStop(0, '#00d2ff');
                    gradient.addColorStop(1, '#0099cc');
                } else {
                    // 蛇身渐变
                    const alpha = 1 - (i / snake.length) * 0.5;
                    gradient.addColorStop(0, `rgba(58, 123, 213, ${alpha})`);
                    gradient.addColorStop(1, `rgba(30, 80, 150, ${alpha})`);
                }
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(cx, cy, CELL_SIZE / 2 - 1, 0, Math.PI * 2);
                ctx.fill();
                
                // 蛇头眼睛
                if (i === 0) {
                    ctx.fillStyle = '#fff';
                    const eyeOffset = CELL_SIZE / 4;
                    
                    if (direction.x === 1) {
                        ctx.beginPath();
                        ctx.arc(cx + eyeOffset / 2, cy - eyeOffset, 3, 0, Math.PI * 2);
                        ctx.arc(cx + eyeOffset / 2, cy + eyeOffset, 3, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (direction.x === -1) {
                        ctx.beginPath();
                        ctx.arc(cx - eyeOffset / 2, cy - eyeOffset, 3, 0, Math.PI * 2);
                        ctx.arc(cx - eyeOffset / 2, cy + eyeOffset, 3, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (direction.y === -1) {
                        ctx.beginPath();
                        ctx.arc(cx - eyeOffset, cy - eyeOffset / 2, 3, 0, Math.PI * 2);
                        ctx.arc(cx + eyeOffset, cy - eyeOffset / 2, 3, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (direction.y === 1) {
                        ctx.beginPath();
                        ctx.arc(cx - eyeOffset, cy + eyeOffset / 2, 3, 0, Math.PI * 2);
                        ctx.arc(cx + eyeOffset, cy + eyeOffset / 2, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });
            
            // 绘制食物（苹果样式）
            if (food) {
                const fx = food.x * CELL_SIZE + CELL_SIZE / 2;
                const fy = food.y * CELL_SIZE + CELL_SIZE / 2;
                
                // 食物光晕
                const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, CELL_SIZE);
                glow.addColorStop(0, 'rgba(255, 50, 50, 0.3)');
                glow.addColorStop(1, 'rgba(255, 50, 50, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(fx, fy, CELL_SIZE, 0, Math.PI * 2);
                ctx.fill();
                
                // 苹果主体
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.arc(fx, fy + 1, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 高光
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(fx - 3, fy - 2, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 叶子
                ctx.fillStyle = '#2ed573';
                ctx.beginPath();
                ctx.ellipse(fx + 3, fy - CELL_SIZE / 2 + 2, 4, 2, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 游戏循环
        function gameStep() {
            update();
            draw();
        }

        // 游戏结束
        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            finalScoreEl.textContent = score;
            gameOverOverlay.classList.remove('hidden');
        }

        // 开始游戏
        function startGame() {
            initGame();
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            isGameStarted = true;
            
            clearInterval(gameLoop);
            gameLoop = setInterval(gameStep, gameSpeed);
        }

        // 暂停/继续
        function togglePause() {
            if (!isGameStarted || isGameOver) return;
            isPaused = !isPaused;
            pauseOverlay.classList.toggle('hidden', !isPaused);
        }


        // 键盘控制
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            // 空格暂停
            if (key === ' ') {
                e.preventDefault();
                togglePause();
                return;
            }
            
            // 方向控制
            if ((key === 'arrowup' || key === 'w') && direction.y !== 1) {
                nextDirection = { x: 0, y: -1 };
            } else if ((key === 'arrowdown' || key === 's') && direction.y !== -1) {
                nextDirection = { x: 0, y: 1 };
            } else if ((key === 'arrowleft' || key === 'a') && direction.x !== 1) {
                nextDirection = { x: -1, y: 0 };
            } else if ((key === 'arrowright' || key === 'd') && direction.x !== -1) {
                nextDirection = { x: 1, y: 0 };
            }
            
            // 阻止方向键滚动页面
            if (key.startsWith('arrow')) {
                e.preventDefault();
            }
        });

        // 移动端按钮控制
        document.querySelectorAll('.mobile-controls button').forEach(btn => {
            btn.addEventListener('click', () => {
                const dir = btn.dataset.dir;
                if (dir === 'up' && direction.y !== 1) nextDirection = { x: 0, y: -1 };
                if (dir === 'down' && direction.y !== -1) nextDirection = { x: 0, y: 1 };
                if (dir === 'left' && direction.x !== 1) nextDirection = { x: -1, y: 0 };
                if (dir === 'right' && direction.x !== -1) nextDirection = { x: 1, y: 0 };
            });
        });

        // 触摸滑动控制
        let touchStart = null;
        canvas.addEventListener('touchstart', (e) => {
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });
        
        canvas.addEventListener('touchend', (e) => {
            if (!touchStart) return;
            const dx = e.changedTouches[0].clientX - touchStart.x;
            const dy = e.changedTouches[0].clientY - touchStart.y;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
                if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
            } else {
                if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
                if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
            }
            touchStart = null;
        }, { passive: true });

        // 难度选择
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gameSpeed = parseInt(btn.dataset.speed);
                if (isGameStarted && !isGameOver) {
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, gameSpeed);
                }
            });
        });

        // 按钮事件
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('resumeBtn').addEventListener('click', togglePause);

        // 初始绘制
        initGame();
        draw();
    </script>
</body>
</html>
